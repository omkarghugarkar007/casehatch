name: Bug report
description: Report a reproducible problem with context, execution, coverage or setup.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Expected and observed behavior
      description: Include the concise check result and the intended outcome.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps and synthetic/redacted inputs. Do not attach private PRDs or credentials.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and versions
      description: CaseHatch, Node, Playwright, OS and coding agent versions, when relevant.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Coverage or scope concern
      description: Did anything incorrectly appear passed, complete, stale, blocked or missing?
